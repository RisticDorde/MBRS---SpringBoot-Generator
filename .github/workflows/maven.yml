name: Java CI with Maven

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Build Framework with Maven
      # Napomena: Ovo će trenutno proći (ili biti preskočeno) jer još nemamo pom.xml u root-u, 
      # ali služi kao skeleton za Issue #4
      run: |
        if [ -f framework/pom.xml ]; then
          mvn -B package --file framework/pom.xml
        else
          echo "No framework pom.xml found yet. Skipping build."
        fi
